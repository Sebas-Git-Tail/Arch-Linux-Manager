# Filtro de rsync para Respaldo-Linux.sh (se carga con --filter="merge ...").
# «-» excluye y «+» incluye. Gana la primera regla que coincide, por eso los «+» van antes
# que los «-». Las rutas que empiezan con / son relativas a la carpeta personal, y *** es
# la carpeta con todo su contenido.
# Excluir SSH
- /.ssh/

# Permitir las instancias de PrismLauncher
# Para entrar a una subcarpeta de .local hay que incluir también cada carpeta del camino
+ /.local/
+ /.local/share/
+ /.local/share/PrismLauncher/
+ /.local/share/PrismLauncher/instances/
+ /.local/share/PrismLauncher/instances/***


# Permitir la base de datos de stock Krocante y app Ingresos y gastos
# (/.local/ y /.local/share/ ya se incluyeron arriba)
+ /.local/share/gestor-stock/***
+ /.local/share/ingresos-gastos/***

# Excluir el resto de .local
- /.local/***

# Exclusiones generales
- /.cache/
- /.var/
- /.steam/
- /.java/
- /Games/
- /VirtualBox VMs/
- /.wine/

# Exclusiones de configuración
- /.config/equibop/
- /.config/Manager/
- /.config/discord/

# Exclusiones de datos de usuario
- /.openclaw
- /.ollama
- /.npm
